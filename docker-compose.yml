# Dev Utils - Docker Compose 배포 설정
version: '3.8'

services:
  dev-utils:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-utils-app
    ports:
      # 외부 포트 3030 -> 컨테이너 포트 3000
      - "3030:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    networks:
      - dev-utils-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dev-utils-network:
    driver: bridge
